<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Item Management</title>

<link rel="stylesheet" href="../css/order_item.css">

</head>

<body>

<h1>Order Item Management</h1>

<form id="orderItemForm">

<input
type="number"
id="order_id"
placeholder="Order ID"
required>

<input
type="number"
id="flower_id"
placeholder="Flower ID"
required>

<input
type="number"
id="quantity"
placeholder="Quantity"
required>

<input
type="number"
id="price"
placeholder="Price"
required>

<button type="submit">
Add Order Item
</button>

</form>

<hr>

<table border="1">

<thead>

<tr>

<th>ID</th>
<th>Order ID</th>
<th>Flower ID</th>
<th>Quantity</th>
<th>Price</th>
<th>Action</th>

</tr>

</thead>

<tbody id="orderItemTable">

</tbody>

</table>

<script src="../js/order_item.js"></script>

</body>
</html>
